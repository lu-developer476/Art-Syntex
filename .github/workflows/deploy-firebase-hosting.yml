name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      FIREBASE_DEPLOY_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ART_SYNTEX }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Validate Firebase deploy credentials
        run: |
          if [ -z "$FIREBASE_DEPLOY_PROJECT_ID" ]; then
            echo "::error::Missing FIREBASE_PROJECT_ID or VITE_FIREBASE_PROJECT_ID secret. Set it to the exact Firebase/GCP project ID."
            exit 1
          fi

          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_ART_SYNTEX secret. Store the Firebase service-account JSON in this existing secret."
            exit 1
          fi

          service_account_project_id="$(jq -r '.project_id // empty' <<< "$FIREBASE_SERVICE_ACCOUNT_JSON")"
          if [ -z "$service_account_project_id" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_ART_SYNTEX is not a valid service-account JSON with a project_id field."
            exit 1
          fi

          if [ "$service_account_project_id" != "$FIREBASE_DEPLOY_PROJECT_ID" ]; then
            echo "::error::Firebase deploy project ($FIREBASE_DEPLOY_PROJECT_ID) does not match the service-account project ($service_account_project_id). Update VITE_FIREBASE_PROJECT_ID or FIREBASE_SERVICE_ACCOUNT_ART_SYNTEX so both point to the same Firebase project."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: ${{ env.FIREBASE_DEPLOY_PROJECT_ID }}
          channelId: live
